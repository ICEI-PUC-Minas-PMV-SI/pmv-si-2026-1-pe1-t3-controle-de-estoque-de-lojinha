<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Cadastrar Usuário</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>
  <main class="element-cadastro-de"> 
    <section class="frame" aria-labelledby="cadastro-titulo">
      
      
      <form class="form-container" id="registroForm" action="#" method="post">
        <h1 class="text-wrapper" id="cadastro-titulo">Cadastrar Usuário</h1>
        
        <div class="div">
          <label class="email-label-1" for="nome">Nome</label>
          <input class="email-input" id="nome" name="nome" type="text" placeholder="Digite o nome completo" autocomplete="name" required>
        </div>

        <div class="div">
          <label class="email-label-3" for="email">E-Mail</label>
          <input class="email-input" id="email" name="email" type="email" placeholder="Digite o e-mail" autocomplete="email" required>
        </div>
        
        <div class="div">
          <label class="email-label-2" for="senha">Senha</label>
          <input type="password" id="senha" class="email-input" placeholder="Digite sua senha" required>
        </div>
        
        <div class="div">
          <label class="email-label-2" for="confirmar-senha">Confirmar Senha</label>
          <input type="password" id="confirmar-senha" class="email-input" placeholder="Repita a senha" required>
        </div>
        <fieldset class="group-botoes">
          <legend class="email-label-wrapper">
            <span class="email-label-4">Grupo de Permissões</span>
          </legend>
          <div class="frame-2">
            <label class="div-wrapper">
              <input type="radio" name="grupo-permissoes" value="gerentes" class="permission-input" required>
              <span class="placeholder-3">Gerentes</span>
            </label>
            <label class="email-input-2">
              <input type="radio" name="grupo-permissoes" value="operadores" class="permission-input">
              <span class="placeholder-3">Operadores</span>
            </label>
            <label class="email-input-3">
              <input type="radio" name="grupo-permissoes" value="visitantes" class="permission-input">
              <span class="placeholder-3">Visitantes</span>
            </label>
            <label class="email-input-4">
              <input type="radio" name="grupo-permissoes" value="administradores" class="permission-input">
              <span class="placeholder-3">Administradores</span>
            </label>
          </div>
        </fieldset>
        
        <button class="btn-cadastrar" type="submit">
          <span class="button-text">Cadastrar</span>
        </button>
      </form>
    </section>
  </main>

  <script src="../java-script/cadastro.js"></script>
</body>

</html>
