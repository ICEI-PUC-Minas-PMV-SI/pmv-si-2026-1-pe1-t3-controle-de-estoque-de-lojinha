<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/produtos.css">
    <script src="../java-script/login.js" defer></script>
    <script defer>
         
          const db_produtos = JSON.parse(localStorage.getItem('db_produtos')) || {
        produtos: []
    };

    function escapeHtml(valor) {

        const mapa = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        };

        return String(valor ?? "").replace(/[&<>"']/g, caractere => mapa[caractere]);
    }

    function formataStatus(produto) {

        if (!produto.quantidade || Number(produto.quantidade) <= 0) {
            return "Sem estoque";
        }

        return "Disponível";
    }

    function exibeProdutos() {

        let listaProdutos = '';

        const filtro = document.getElementById("busca-produtos")?.value.trim().toLowerCase() || "";

        const produtosFiltrados = (db_produtos.produtos || []).filter(produto => {

            const textoBusca = `
                ${produto.nome || ""}
                ${produto.fornecedor || ""}
                ${produto.notaFiscal || ""}
            `.toLowerCase();

            return textoBusca.includes(filtro);
        });

        if (produtosFiltrados.length === 0) {

            document.getElementById("table-produtos").innerHTML = `
                <tr class="empty-row">
                    <td colspan="6">Nenhum produto encontrado</td>
                </tr>
            `;

            return;
        }

        for (let i = 0; i < produtosFiltrados.length; i++) {

            let produto = produtosFiltrados[i];

            const status = formataStatus(produto);

            const statusClasse =
                status.toLowerCase().includes("sem")
                    ? "inactive"
                    : "active";

            listaProdutos += `
                <tr>

                    <td class="cell-strong">
                        ${escapeHtml(produto.nome || "-")}
                    </td>

                    <td>
                        ${escapeHtml(produto.quantidade || "-")}
                    </td>

                    <td>
                        R$ ${escapeHtml(produto.preco || "-")}
                    </td>

                    <td>
                        ${escapeHtml(produto.fornecedor || "-")}
                    </td>

                    <td>
                        ${escapeHtml(produto.notaFiscal || "-")}
                    </td>

                    <td>
                        <span class="user-status user-status-${statusClasse}">
                            ${escapeHtml(status)}
                        </span>
                    </td>
                    <td>
                        <button
                           type="button"
                           onclick="editarProduto('${produto.id}')">
                           Editar
                        </button>
                        <button
                           type="button"
                           onclick="excluirProduto('${produto.id}')">
                           Excluir
                        </button>
                    </td>

                </tr>
            `;
        }

        document.getElementById("table-produtos").innerHTML = listaProdutos;
    }
    function excluirProduto(id){
        const confirmar = confirm("Deseja excluir este produto?");
        if(!confirmar){
            return; 
        }
        db_produtos.produtos = db_produtos.produtos.filter(produto => produto.id !== id);
        localStorage.setItem('db_produtos', JSON.stringify(db_produtos));
        exibeProdutos();    
    }
    function editarProduto(id) {

    localStorage.setItem(
        'produtoEdicao',
        id
    );

    window.location.href =
        './cadastrop.html';
}
    function initPage() {

        if (!usuarioCorrente.login) {
            window.location.href = LOGIN_URL;
        }

        exibeProdutos();

        const campoBusca = document.getElementById("busca-produtos");

        if (campoBusca) {
            campoBusca.addEventListener("input", exibeProdutos);
        }
    }

    window.addEventListener('load', initPage);

        
    </script>
</head>
