'<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada de produtos</title>
    <link rel="stylesheet" href="../css/produtos.css">
</head>
<body>

    <div class="container">
        <h1>Nova Entrada de Produto</h1>

        <div>
            <label>Produto</label>
            <input type="text" placeholder="Buscar produto por nome ou código...">
        </div>
        
        <div>
            <label>Quantidade</label>
            <input type="number" placeholder="0">
        </div>

        <div>
            <label>Preço Unitário</label>
            <input type="number" placeholder="R$0.00" step="R$0.01">
        </div>

        <div>
            <label>Fornecedor</label>
            <input type="text" placeholder="Nome do fornecedor">
        </div>

        <div>
            <label>Nota Fiscal</label>
            <input type="text" placeholder="N° da NF">
        </div>

        <div>
            <label>Data</label>
            <input type="date" placeholder="dd/mm/aaaa">
        </div>

        <div>
            <label>Observações</label>
            <input type="text" placeholder="Observações opcionais...">
        </div>
 
        <button>Registrar Entrada</button>
    </div>

</body>
</html>
