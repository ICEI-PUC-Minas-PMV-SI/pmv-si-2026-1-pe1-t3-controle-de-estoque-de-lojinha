    <script defer>
         

    function exibeProdutos() {

        let listaProdutos = '';

        for (i = 0; i < db_produtos.produtos.length; i++) {

            let produto = db_produtos.produtos[i];

            listaProdutos += `
                <tr>
                    <td>${produto.id}</td>
                    <td>${produto.nome}</td>
                    <td>${produto.categoria}</td>
                    <td>${produto.limite}</td>
                    <td>${produto.quantidade}</td>
                    <td>${produto.preco}</td>
                    <td>Ativo</td>
                </tr>
            `;
        }

        document.getElementById("table-produtos").innerHTML = listaProdutos;
    }

    </script>
