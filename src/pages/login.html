<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Controle de Estoque</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
</head>

<body>
  <main class="element-login">
    <section class="right-panel" aria-labelledby="page-title">
      <div class="form-wrapper">
        <form class="form-container" onsubmit="processaFormLogin(event)">
          <header class="frame">
            <div class="login-brand-row">
              <img src="../../docs/img/logo.header.svg" alt="Estoque Search" class="login-logo">
              <h1 class="welcome" id="page-title">Estoque<br>Search</h1>
            </div>
            <p class="welcome-sub">Faça login para continuar</p>
          </header>
          <div class="div">
            <label class="email-label" for="email">E-mail</label>
            <div class="input-group">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input class="email-input" id="email" name="email" type="email" placeholder="seu@email.com"
                autocomplete="email" inputmode="email" aria-required="true" />
            </div>
          </div>

          <div class="frame-2">
            <div class="div">
              <label class="email-label" for="password">Senha</label>
              <div class="input-group">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input class="placeholder-wrapper" id="password" name="password" type="password" placeholder="••••••••"
                  autocomplete="current-password" aria-required="true" />
              </div>
            </div>
          </div>

          <button class="login-button" type="submit">
            <span class="button-text">Entrar</span>
          </button>

        </form>
      </div>
    </section>
  </main>
  <script src="../java-script/login.js"></script>
  <script>
    function processaFormLogin(event) {
      event.preventDefault();
      var username = document.getElementById("email").value;
      var password = document.getElementById("password").value;
      resultadoLogin = loginUser(username, password);
      if (resultadoLogin) {
        window.location.href = "./dashboard.html";
      }
      else {
        alert("Usuário ou senha incorretos");

      }
    }
  </script>
</body>

</html>
