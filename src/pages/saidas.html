<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>usuarios</title>
    <link rel="stylesheet" href="../css/global.css">
    <!--<link rel="stylesheet" href="../css/usuarios.css">-->
    <link rel="stylesheet" href="../css/saidas.css">
    <script src="../java-script/login.js" defer></script>
    <script src="../java-script/acesso.js" defer></script>
    <script defer>
        let db_saidas = JSON.parse(localStorage.getItem("db_saidas")) || {
            saidas: []
        };
        let db_produtos = JSON.parse(
            localStorage.getItem("db_produtos")
        ) || {
            produtos: []
        };
        function carregarProdutos() {

            const lista =
                document.getElementById("lista-produtos");

            lista.innerHTML = "";

            db_produtos.produtos.forEach(produto => {

                lista.innerHTML += `
            <option value="${produto.nome}">
        `;
            });
        }
        function preencherDadosProduto() {

            const nomeProduto =
                document.getElementById("busca-produtos").value;

            const produto = db_produtos.produtos.find(
                p => p.nome.toLowerCase() ===
                    nomeProduto.toLowerCase()
            );

            if (!produto) {
                return;
            }

            document.getElementById("preco").value =
                produto.preco || "";

            document.getElementById("fornecedor").value =
                produto.fornecedor || "";

            document.getElementById("nf").value =
                produto.notaFiscal || "";
        }
        function registrarSaida() {

            const produto = document.getElementById("busca-produtos").value;
            const produtoEncontrado =
                db_produtos.produtos.find(
                    p => p.nome.toLowerCase() ===
                        produto.toLowerCase()
                );

            if (!produtoEncontrado) {

                alert("Produto não encontrado.");
                return;
            }
            const quantidade = document.getElementById("quantidade").value;
            const preco = document.getElementById("preco").value;
            const fornecedor = document.getElementById("fornecedor").value;
            const nf = document.getElementById("nf").value;
            const data = document.getElementById("data").value;
            const observacoes = document.getElementById("obs").value;

            if (!produto || !quantidade) {
                alert("Preencha produto e quantidade.");
                return;
            }


            if (
                Number(quantidade) >
                Number(produtoEncontrado.quantidade)
            ) {
                alert("Estoque insuficiente.");
                return;
            }
            const novaSaida = {
                codigo: Date.now(),
                produto,
                quantidade,
                preco,
                fornecedor,
                nf,
                data,
                observacoes
            };

            db_saidas.saidas.push(novaSaida);

            localStorage.setItem(
                "db_saidas",
                JSON.stringify(db_saidas)
            );

            produtoEncontrado.quantidade =
                Number(produtoEncontrado.quantidade) -
                Number(quantidade);

            localStorage.setItem(
                "db_produtos",
                JSON.stringify(db_produtos)
            );



            document.getElementById("busca-produtos").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("preco").value = "";
            document.getElementById("fornecedor").value = "";
            document.getElementById("nf").value = "";
            document.getElementById("data").value = "";
            document.getElementById("obs").value = "";

            exibeSaidas();
        }



        function escapeHtml(valor) {

            const mapa = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };

            return String(valor ?? "")
                .replace(/[&<>"']/g, caractere => mapa[caractere]);
        }

        function exibeSaidas() {

            let listaSaidas = "";

            if (db_saidas.saidas.length === 0) {

                document.getElementById("table-saidas").innerHTML = `
<tr class="empty-row">
    <td colspan="8">
        Nenhuma saída cadastrada
    </td>
</tr>
        `;

                return;
            }

            for (let i = 0; i < db_saidas.saidas.length; i++) {

                const saida = db_saidas.saidas[i];

                listaSaidas += `
            <tr>
                <td>${saida.codigo}</td>
                <td>${escapeHtml(saida.produto)}</td>
                <td>-</td>
                <td>${escapeHtml(saida.quantidade)}</td>
                <td>R$ ${escapeHtml(saida.preco)}</td>
                <td>${escapeHtml(saida.nf)}</td>
                <td>${escapeHtml(saida.data)}</td>
                <td>
                    <span class="actions-group">
                        <button type="button" class="btn-action btn-action-delete" onclick="excluirSaida(${i})" title="Excluir saída">
                            <img src="../../docs/img/icons/trash-delete.svg" alt="Excluir">
                        </button>
                    </span>
                </td>
            </tr>
        `;
            }

            document.getElementById("table-saidas").innerHTML = listaSaidas;
        }

        function excluirSaida(indice) {
            const confirmar = confirm(
                "Deseja realmente exlcuir esta saída?"
            );
            if (!confirmar) {
                return;
            }
            const saida = db_saidas.saidas[indice];

            const produto = db_produtos.produtos.find(
                p => p.nome === saida.produto
            );

            if (produto) {

                produto.quantidade =
                    Number(produto.quantidade) +
                    Number(saida.quantidade);

                localStorage.setItem(
                    "db_produtos",
                    JSON.stringify(db_produtos)
                );
            }

            db_saidas.saidas.splice(indice, 1);

            localStorage.setItem(
                "db_saidas",
                JSON.stringify(db_saidas)
            );

            exibeSaidas();

        }
        function initPage() {


            document
                .getElementById("btnRegistrarSaida")
                ?.addEventListener(
                    "click",
                    registrarSaida
                );

            document
                .getElementById("busca-produtos")
                ?.addEventListener(
                    "change",
                    preencherDadosProduto
                );

            carregarProdutos();

            exibeSaidas();
        }

        window.addEventListener("load", initPage);

    </script>
</head>

        <main class="app-main">
            <header class="app-header">
                <div class="app-header-panel">

                    <div class="app-header-profile">
                        <img src="../../docs/img/15_foto_perfil.svg" alt="Foto do perfil">
                    </div>
                </div>
            </header>

            <section class="app-content produtos-content" aria-label="Conteúdo de produtos">


                <div class="product-toolbar">

                    </div>

                    <div class="product-search-field">

                        <label for="busca-produtos">Produto</label>
                        <div class="product-search-box">

                            <input id="busca-produtos" type="search" placeholder="Digite o produto"
                                list="lista-produtos" autocomplete="off">

                            <datalist id="lista-produtos"></datalist>

                    <div class="product-row">
                        <div class="product-field">
                            <label for="quantidade">Quantidade</label>

                        <div class="product-field">
                            <label for="preco">Preço Unitário</label>
                            <input id="preco" type="number" placeholder="R$ 0,00" step="0.01">
                        </div>
                    </div>

                    <div class="product-field">
                        <label for="fornecedor">Fornecedor</label>
                        <input id="fornecedor" type="text" placeholder="Nome do Fornecedor">
                    </div>

                    <div class="product-row">
                        <div class="product-field">

                        </div>

                        <div class="product-field">

                    <div class="product-search-field">

                        <input id="obs" type="text" placeholder="Observações adicionais">

                    <div class="product-actions">

                    <div class="product-recent-table-card">

                                <thead>
                                    <tr>
                                        <th scope="col">Código</th>
