    <script defer> 

        function escapeHtml(valor) {
            const mapa = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };

            return String(valor ?? "").replace(/[&<>"']/g, caractere => mapa[caractere]);
        }

        function formataGrupo(usuario) {
            let grupo = usuario.grupo || usuario.grupoDePermissoes || usuario.setor;

            if (!grupo && usuario.login && usuario.login.toLowerCase().includes("adm")) {
                grupo = "Administradores";
            }

            if (!grupo) {
                grupo = "Gerentes";
            }

            const grupos = {
                admin: "Admin",
                administrador: "Administradores",
                administradores: "Administradores",
                gerente: "Gerentes",
                gerentes: "Gerentes",
                operador: "Operadores",
                operadores: "Operadores",
                visitante: "Visitantes",
                visitantes: "Visitantes"
            };

            return grupos[String(grupo).toLowerCase()] || grupo;
        }

        function formataStatus(usuario) {
            return usuario.status || "Ativo";
        }

        function formataDataUsuario(usuario) {
            const dataBruta = usuario.criadoEm || usuario.dataCadastro || usuario.createdAt || usuario.created_at;

            if (!dataBruta) {
                return "01/01/2026";
            }

            if (/^\d{2}\/\d{2}\/\d{4}$/.test(dataBruta)) {
                return dataBruta;
            }

            const data = new Date(dataBruta);

            if (Number.isNaN(data.getTime())) {
                return dataBruta;
            }

            return data.toLocaleDateString("pt-BR");
        }

        function exibeUsuarios() {

            // Popula a tabela com os registros do banco de dados
            let listaUsuarios = '';
            const filtro = document.getElementById("busca-usuarios")?.value.trim().toLowerCase() || "";
            const usuariosFiltrados = (db_usuarios.usuarios || []).filter(usuario => {
                const textoBusca = `${usuario.nome || ""} ${usuario.email || ""} ${usuario.login || ""}`.toLowerCase();

                return textoBusca.includes(filtro);
            });

            if (usuariosFiltrados.length === 0) {
                document.getElementById("table-usuarios").innerHTML = `
                    <tr class="empty-row">
                        <td colspan="5">Nenhum usuário encontrado</td>
                    </tr>
                `;
                return;
            }

            for (let i = 0; i < usuariosFiltrados.length; i++) {
                let usuario = usuariosFiltrados[i];
                const status = formataStatus(usuario);
                const statusClasse = status.toLowerCase().includes("inat") ? "inactive" : "active";

                listaUsuarios += `<tr>
                    <td class="cell-strong">${escapeHtml(usuario.nome || usuario.login || "-")}</td>
                    <td>${escapeHtml(usuario.email || usuario.login || "-")}</td>
                    <td><span class="user-tag">${escapeHtml(formataGrupo(usuario))}</span></td>
                    <td><span class="user-status user-status-${statusClasse}">${escapeHtml(status)}</span></td>
                    <td>${escapeHtml(formataDataUsuario(usuario))}</td>
                    <td><button type="button">Editar</button></td>
                    <td><button type="button">Excluir</button></td>
                </tr>`;
            }

            // Substitui as linhas do corpo da tabela
            document.getElementById("table-usuarios").innerHTML = listaUsuarios

        }

        function initPage() {

            // Associa a função de logout ao botão fica logo abaixo
            //---botão de logout para configurar em js depois---

            // Verifica se o usuário já esta logado e se negativo, redireciona para tela de login
        if (!usuarioCorrente.login) {
            window.location.href = LOGIN_URL;
        }

            // Lista os usuários
            exibeUsuarios ();

            const campoBusca = document.getElementById("busca-usuarios");

            if (campoBusca) {
                campoBusca.addEventListener("input", exibeUsuarios);
            }
        }

        // Associa ao evento de carga da página a função para verificar se o usuário está logado
        window.addEventListener('load', initPage);

    </script>
