        const DB_SAIDAS_VERSAO = '2';

        function inicializarSaidas() {
            const versaoSalva = localStorage.getItem('db_saidas_versao');
            if (versaoSalva !== DB_SAIDAS_VERSAO) {
                localStorage.setItem('db_saidas', JSON.stringify({ saidas: SEED_SAIDAS }));
                localStorage.setItem('db_saidas_versao', DB_SAIDAS_VERSAO);
                db_saidas.saidas = SEED_SAIDAS;
            }
        }

        function carregarProdutos() {

            const lista =
                document.getElementById("lista-produtos");

            lista.innerHTML = "";

            db_produtos.produtos.forEach(produto => {

                lista.innerHTML += `
            <option value="${produto.nome}">
        `;
            });
        }
        function preencherDadosProduto() {

            const nomeProduto =
                document.getElementById("busca-produtos").value;

            const produto = db_produtos.produtos.find(
                p => p.nome.toLowerCase() ===
                    nomeProduto.toLowerCase()
            );

            if (!produto) {
                return;
            }

            document.getElementById("preco").value =
                produto.preco || "";

            document.getElementById("fornecedor").value =
                produto.fornecedor || "";

            document.getElementById("nf").value =
                produto.notaFiscal || "";
        }
        function registrarSaida() {

            const produto = document.getElementById("busca-produtos").value;
            const produtoEncontrado =
                db_produtos.produtos.find(
                    p => p.nome.toLowerCase() ===
                        produto.toLowerCase()
                );

            if (!produtoEncontrado) {

                alert("Produto não encontrado.");
                return;
            }
            const quantidade = document.getElementById("quantidade").value;
            const preco = document.getElementById("preco").value;
            const fornecedor = document.getElementById("fornecedor").value;
            const nf = document.getElementById("nf").value;
            const data = document.getElementById("data").value;
            const observacoes = document.getElementById("obs").value;

            if (!produto || !quantidade) {
                alert("Preencha produto e quantidade.");
                return;
            }


            if (
                Number(quantidade) >
                Number(produtoEncontrado.quantidade)
            ) {
                alert("Estoque insuficiente.");
                return;
            }
            const novaSaida = {
                codigo: Date.now(),
                produto,
                quantidade,
                preco,
                fornecedor,
                nf,
                data,
                observacoes
            };

            db_saidas.saidas.push(novaSaida);

            localStorage.setItem(
                "db_saidas",
                JSON.stringify(db_saidas)
            );

            produtoEncontrado.quantidade =
                Number(produtoEncontrado.quantidade) -
                Number(quantidade);

            localStorage.setItem(
                "db_produtos",
                JSON.stringify(db_produtos)
            );



            document.getElementById("busca-produtos").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("preco").value = "";
            document.getElementById("fornecedor").value = "";
            document.getElementById("nf").value = "";
            document.getElementById("data").value = "";
            document.getElementById("obs").value = "";

            exibeSaidas();
        }



        function escapeHtml(valor) {

            const mapa = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };

            return String(valor ?? "")
                .replace(/[&<>"']/g, caractere => mapa[caractere]);
        }

        function exibeSaidas() {

            let listaSaidas = "";

            if (db_saidas.saidas.length === 0) {

                document.getElementById("table-saidas").innerHTML = `
<tr class="empty-row">
    <td colspan="8">
        Nenhuma saída cadastrada
    </td>
</tr>
        `;

                return;
            }

            for (let i = 0; i < db_saidas.saidas.length; i++) {

                const saida = db_saidas.saidas[i];

                listaSaidas += `
            <tr>
                <td>${saida.codigo}</td>
                <td>${escapeHtml(saida.produto)}</td>
                <td>-</td>
                <td>${escapeHtml(saida.quantidade)}</td>
                <td>R$ ${escapeHtml(saida.preco)}</td>
                <td>${escapeHtml(saida.nf)}</td>
                <td>${escapeHtml(saida.data)}</td>
                <td>
                    <span class="actions-group">
                        <button type="button" class="btn-action btn-action-delete" onclick="excluirSaida(${i})" title="Excluir saída">
                            <img src="../../docs/img/icons/trash-delete.svg" alt="Excluir">
                        </button>
                    </span>
                </td>
            </tr>
        `;
            }

            document.getElementById("table-saidas").innerHTML = listaSaidas;
        }

        function excluirSaida(indice) {
            const confirmar = confirm(
                "Deseja realmente exlcuir esta saída?"
            );
            if (!confirmar) {
                return;
            }
            const saida = db_saidas.saidas[indice];

            const produto = db_produtos.produtos.find(
                p => p.nome === saida.produto
            );

            if (produto) {

                produto.quantidade =
                    Number(produto.quantidade) +
                    Number(saida.quantidade);

                localStorage.setItem(
                    "db_produtos",
                    JSON.stringify(db_produtos)
                );
            }

            db_saidas.saidas.splice(indice, 1);

            localStorage.setItem(
                "db_saidas",
                JSON.stringify(db_saidas)
            );

            exibeSaidas();

        }
        function initPage() {

            inicializarSaidas();

            document
                .getElementById("btnRegistrarSaida")
                ?.addEventListener(
                    "click",
                    registrarSaida
                );

            document
                .getElementById("busca-produtos")
                ?.addEventListener(
                    "change",
                    preencherDadosProduto
                );

            carregarProdutos();

            exibeSaidas();
        }

        window.addEventListener("load", initPage);
