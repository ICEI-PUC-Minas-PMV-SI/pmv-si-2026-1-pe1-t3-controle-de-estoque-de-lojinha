    <script defer>
let db_saidas = JSON.parse(localStorage.getItem("db_saidas")) || {
    saidas: []
};

function registrarSaida() {

    const produto = document.getElementById("busca-produtos").value;
    const quantidade = document.getElementById("quantidade").value;
    const preco = document.getElementById("preco").value;
    const fornecedor = document.getElementById("fornecedor").value;
    const nf = document.getElementById("nf").value;
    const data = document.getElementById("data").value;
    const observacoes = document.getElementById("obs").value;

    if (!produto || !quantidade) {
        alert("Preencha produto e quantidade.");
        return;
    }

    const novaSaida = {
        codigo: Date.now(),
        produto,
        quantidade,
        preco,
        fornecedor,
        nf,
        data,
        observacoes
    };

    db_saidas.saidas.push(novaSaida);

    localStorage.setItem(
        "db_saidas",
        JSON.stringify(db_saidas)
    );

    exibeSaidas();
}

function escapeHtml(valor) {

    const mapa = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    };

    return String(valor ?? "")
        .replace(/[&<>"']/g, caractere => mapa[caractere]);
}

function exibeSaidas() {

    let listaSaidas = "";

    if (db_saidas.saidas.length === 0) {

        document.getElementById("table-saidas").innerHTML = `
            <tr class="empty-row">
                <td colspan="9">
                    Nenhuma saída cadastrada
                </td>
            </tr>
        `;

        return;
    }

    for (let i = 0; i < db_saidas.saidas.length; i++) {

        const saida = db_saidas.saidas[i];

        listaSaidas += `
            <tr>
                <td>${saida.codigo}</td>
                <td>${escapeHtml(saida.produto)}</td>
                <td>-</td>
                <td>${escapeHtml(saida.quantidade)}</td>
                <td>R$ ${escapeHtml(saida.preco)}</td>
                <td>${escapeHtml(saida.nf)}</td>
                <td>${escapeHtml(saida.data)}</td>
                <td><button type="button">Editar</button></td>
                <td><button type="button">Excluir</button></td>
            </tr>
        `;
    }

    document.getElementById("table-saidas").innerHTML = listaSaidas;
}

function initPage() {

    document
        .getElementById("btnRegistrarSaida")
        ?.addEventListener("click", registrarSaida);

    exibeSaidas();
}

window.addEventListener("load", initPage);

    </script>
